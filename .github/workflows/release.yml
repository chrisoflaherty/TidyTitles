# Builds the desktop installers and attaches them to a GitHub release.
#
# Runs when a version tag is pushed (for example v0.2.0-beta.1). The tag
# must match the version in apps/desktop/package.json. Tags containing a
# hyphen (-beta.1, -rc.1) are published as prereleases.
#
# The builds are not code signed. See BUILD.md for what that means for
# people installing them.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the app version
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${version}" >&2
            exit 1
          fi
      - name: Create the release if it does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          flags=()
          case "${GITHUB_REF_NAME}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "TidyTitles ${GITHUB_REF_NAME#v}" --generate-notes "${flags[@]}"

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac dmg --arm64 --x64
          - name: Windows
            os: windows-latest
            args: --win nsis --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux AppImage --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build core, CLI, and desktop
        run: npm run build
      - name: Build installers
        working-directory: apps/desktop
        env:
          # Unsigned builds: do not look for signing certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never
      - name: Upload installers to the release
        shell: bash
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(*.dmg *.exe *.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers were produced" >&2
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
