# electron-builder configuration for TidyTitles.
# Identifiers and names follow the PyInstaller/NSIS/DMG/AppImage setup
# (file-renamer.spec, installer/): bundle id com.filerenamer.tidytitles,
# product name TidyTitles, artifacts TidyTitles-<version>-macos-<arch>.dmg,
# TidyTitles-<version>-windows-setup.exe, TidyTitles-<version>-<arch>.AppImage.
#
# Automatic updates (electron-updater, see src/main/updaterEngine.ts) read
# the update-info files written next to the installers. The release workflow
# builds with --publish never and uploads everything with `gh release upload`;
# scripts/check-update-feed.mjs checks the output first.

appId: com.filerenamer.tidytitles
productName: TidyTitles
copyright: Copyright © 2024 Chris O’Flaherty
artifactName: ${productName}-${version}-${os}.${ext}

directories:
  output: release
  buildResources: build

# Only the production build. out-e2e/ (the test build with fake providers)
# is never packaged. Main bundles @tidytitles/core, electron-updater, and
# their dependencies, so no node_modules are needed (electron-updater is a
# devDependency for that reason).
files:
  - out/**/*
  - "!out/**/*.map"
  - package.json
asar: true
afterPack: scripts/after-pack.cjs

# The command-line tool, run by the "Install Command Line Tool…" launcher.
extraResources:
  - from: ../../packages/cli/dist/tidytitles.mjs
    to: cli/tidytitles.mjs

# The update feed. `${channel}` is the prerelease part of the version
# ("beta" for 0.2.0-beta.3) or "latest" for a stable version, so a beta build
# writes beta-mac.yml / beta.yml / beta-linux.yml and a stable build
# latest-mac.yml / latest.yml / latest-linux.yml: exactly the files
# electron-updater's GitHub provider asks for in that release. The same
# settings go into resources/app-update.yml.
publish:
  provider: github
  owner: chrisoflaherty
  repo: TidyTitles
  channel: ${channel}

mac:
  # The zip is what the updater downloads (Squirrel.Mac installs from a
  # zip); the DMG is for people installing by hand.
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  icon: build/icon.icns
  darkModeSupport: true
  # Hardened runtime with electron-builder's default entitlements
  # (allow-jit, allow-unsigned-executable-memory, disable-library-validation),
  # which Electron needs, also in ELECTRON_RUN_AS_NODE mode (the CLI). Applies
  # only when a real identity signs; the ad-hoc signature in after-pack.cjs
  # has no hardened runtime.
  hardenedRuntime: true
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  # Document types, so files and folders can be dropped on the Dock icon
  # (and on the app's icon in Finder), and folders can be opened with
  # Finder's "Open With". TidyTitles must never become the default app for
  # any of them:
  # - Folders: rank Alternate, so TidyTitles is listed under "Open With".
  #   Finder always owns folders, so it stays their default.
  # - Video and audio files: rank None (accepts drops, never opens them on a
  #   double-click). Alternate is not enough: when no other installed app
  #   claims a type (.mkv and .ape on a stock Mac; .ogg, .opus, .webm without
  #   Chrome), Launch Services makes an Alternate app the default. The
  #   price is that files do not list TidyTitles under "Open With".
  # Declared here and not in a top-level `fileAssociations`, because
  # electron-builder's NSIS installer registers every `fileAssociations`
  # extension as the default for that type (its APP_ASSOCIATE macro sets
  # HKCU\Software\Classes\.<ext>), which would take over double-click on
  # Windows. Windows and Linux get opened files from the command line
  # instead (see src/main/openPaths.ts).
  # The extensions are core's VIDEO_EXTENSIONS and MUSIC_EXTENSIONS;
  # tests/main/documentTypes.test.ts fails when they differ.
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
      - CFBundleTypeName: Video File
        CFBundleTypeRole: Viewer
        LSHandlerRank: None
        CFBundleTypeExtensions:
          - avi
          - flv
          - m2ts
          - m4v
          - mkv
          - mov
          - mp4
          - mpeg
          - mpg
          - ts
          - webm
          - wmv
      - CFBundleTypeName: Audio File
        CFBundleTypeRole: Viewer
        LSHandlerRank: None
        CFBundleTypeExtensions:
          - aac
          - aiff
          - ape
          - flac
          - m4a
          - mp3
          - ogg
          - opus
          - wav
          - wma

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-macos-${arch}.${ext}

win:
  target: nsis
  icon: build/icon.png
  artifactName: ${productName}-${version}-windows-setup.${ext}

# Per-user by default, so installing and updating need no administrator
# prompt (the installer runs with RequestExecutionLevel user). The installer
# still offers "Anyone who uses this computer". An existing per-machine
# install is detected (HKLM InstallLocation) and stays per-machine; updating
# it shows one UAC prompt per update. See wiki/Installation.md.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TidyTitles
  license: ../../installer/windows/license.txt
  artifactName: ${productName}-${version}-windows-setup.${ext}

linux:
  target: AppImage
  icon: build/icon.png
  category: Utility
  executableName: TidyTitles
  synopsis: Media file renaming application
  desktop:
    entry:
      Name: TidyTitles
      Comment: Media file renaming application
      Categories: AudioVideo;Video;Audio;Utility;
      Keywords: rename;media;movie;tv;music;metadata;
      StartupWMClass: TidyTitles
  artifactName: ${productName}-${version}-${arch}.${ext}
